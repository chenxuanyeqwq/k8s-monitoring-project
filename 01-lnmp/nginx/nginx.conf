# Nginx 配置（HTTPS 版）
# 加固（2026-08-31）：敏感路径 444 + 未知路径 404（关放大器）+ 单IP限流 + 日志双写(文件→fail2ban / stdout→Loki)
#
# 链路：浏览器 -> HTTPS(443) -> PHP 转发给 php-fpm(php:9000) -> php 连 MySQL(db:3306)

log_format access_main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
limit_req_zone  $binary_remote_addr zone=req_limit:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:1m;
limit_req_status  429;
limit_conn_status 429;

# ---------- HTTP :80（证书验证 + 重定向） ----------
server {
    listen 80;
    server_name www.fchen.xyz fchen.xyz localhost;

    access_log /var/log/nginx/access.log access_main;   # 文件 → fail2ban
    access_log /dev/stdout access_main;                 # stdout → Loki
    error_log  /dev/stderr warn;

    limit_req  zone=req_limit burst=20 nodelay;
    limit_conn conn_limit 10;

    # Let's Encrypt 证书验证目录（acme.sh webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # 其余 HTTP 请求全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443（主站） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name www.fchen.xyz fchen.xyz;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php;

    access_log /var/log/nginx/access.log access_main;   # 文件 → fail2ban
    access_log /dev/stdout access_main;                 # stdout → Loki
    error_log  /dev/stderr warn;

    limit_req  zone=req_limit burst=20 nodelay;
    limit_conn conn_limit 10;

    # SSRF 探测（云元数据 169.254.169.254 / metadata.google 等，$request_uri 含查询串）-> 断连
    if ($request_uri ~* "(169\.254\.169\.254|metadata\.google\.internal|/latest/meta-data)") {
        return 444;
    }

    # 主站：只放行真实文件/目录，其余一律 404（关闭"放大器"）
    location / {
        try_files $uri $uri/ =404;
    }

    # ===== 敏感路径屏蔽（444 断连；必须放在 .php 正则之前） =====
    # 444 不响应任何字节（比 404 更省带宽），仍计入 access_log 供 fail2ban
    # 1) 敏感文件/目录（.env/.git/.aws/.ssh/版本控制/IDE）
    location ~ ^/(\.env(\.[a-z0-9_]+)?|\.git(ignore|config|attributes)?|\.aws|\.ssh|\.svn|\.hg|\.idea|\.vscode|\.DS_Store|\.htaccess|\.htpasswd)(/|$) { return 444; }
    # 2) CMS/框架/运维探针（wp-config/wp-admin/xmlrpc/phpmyadmin/adminer/actuator/依赖清单）
    location ~ (^|/)(wp-config\.(php|txt|bak)|wp-(login|admin)\.php|xmlrpc\.php|phpmyadmin|adminer|actuator|phpinfo\.php|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|dump\.sql)(/|$) { return 444; }
    # 3) 备份/编辑器/临时/压缩包产物（*.sql *.bak *.old *.swp *.tar.gz *.zip 等）
    location ~ \.(sql|sqlite|db|bak|old|orig|swp|tmp|log|tar|gz|zip|7z|rar|ini|cfg|conf)(\.|$|~) { return 444; }
    # 4) vim 备份 foo~ / foo.php~
    location ~ /[^/]*~$ { return 444; }

    # .php 请求交给 php-fpm（只有真实存在的 index.php 才会执行）
    location ~ \.php$ {
        limit_req zone=req_limit burst=5 nodelay;   # php 是昂贵路径，收紧
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # nginx 状态接口(供 nginx-exporter 采集,只允许 Docker 内网访问)
    location /stub_status {
        stub_status on;
        access_log off;
        allow 172.16.0.0/12;
        deny all;
    }
}
