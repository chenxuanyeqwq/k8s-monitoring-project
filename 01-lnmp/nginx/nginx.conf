# Nginx 配置（HTTPS 版）：
#   HTTP(80) 只做两件事：Let's Encrypt 验证 + 301 重定向到 HTTPS
#   HTTPS(443) 承载留言板主站
#
# 链路：浏览器 -> HTTPS(443) -> PHP 转发给 php-fpm(php:9000) -> php 连 MySQL(db:3306)

# ---------- HTTP :80（证书验证 + 重定向） ----------
server {
    listen 80;
    server_name www.fchen.xyz fchen.xyz localhost;

    # Let's Encrypt 证书验证目录（acme.sh webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # 其余 HTTP 请求全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443（主站） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name www.fchen.xyz fchen.xyz;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;              # 与 php 容器共享的代码目录
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 以 .php 结尾的请求交给 php-fpm 处理
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # nginx 状态接口(供 nginx-exporter 采集,只允许 Docker 内网访问)
    location /stub_status {
        stub_status on;
        access_log off;
        allow 172.16.0.0/12;
        deny all;
    }
}
