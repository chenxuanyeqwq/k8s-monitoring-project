# Nginx 默认站点配置：把 PHP 请求转发给 php-fpm
#
# 链路：浏览器 -> Nginx(80) -> 转发 .php 给 php-fpm(php:9000) -> php 连 MySQL(db:3306)
server {
    listen 80;
    server_name localhost;
    root /var/www/html;              # 与 php 容器共享的代码目录
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 以 .php 结尾的请求交给 php-fpm 处理
    # fastcgi_pass 里的 "php" 是 compose 里的服务名，Docker 内置 DNS 解析成 php 容器 IP
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
