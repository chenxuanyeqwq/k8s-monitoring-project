# LNMP 留言板 —— Nginx + PHP-FPM + MySQL 三容器编排
#
# 用法：
#   docker compose up -d --build   # 构建并启动
#   docker compose down            # 停止并删除容器（数据还在 volume 里）
#   浏览器访问 http://localhost:8080
#
# 关键点：MySQL 数据放在 named volume(mysql_data)，容器删了数据不丢。
# 这是本模块要验证的核心概念：持久化。

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lnmp-nginx
    restart: unless-stopped     # 服务器重启后自动拉起（2026-08-27 OOM 事故后补）
    mem_limit: 128m             # 内存护栏：单个容器不能把整机拖死
    mem_reservation: 64m
    ports:
      - "8080:80"                     # 过渡期保留(HTTP 旧入口,验证完可去)
      - "80:80"                       # HTTP -> Let's Encrypt 验证 + 301 到 HTTPS
      - "443:443"                     # HTTPS 主入口
    volumes:
      - ./php/www:/var/www/html               # 与 php 容器共享代码目录（nginx 负责转发）
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # TLS 证书（签发后生成，不入库）
      - ./nginx/acme:/var/www/acme             # Let's Encrypt 验证目录（不入库）
    depends_on:
      - php

  php:
    # 阶段2：镜像由 CI 构建推送 ACR，服务器只拉取（不再在服务器/本地 build）
    image: ${ACR_REGISTRY}/fchen/lnmp-php:${IMAGE_TAG:-latest}
    container_name: lnmp-php
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    volumes:
      - ./php/www:/var/www/html               # 代码由宿主机挂载，镜像只提供运行时
    environment:
      MYSQL_HOST: db                  # compose 网络内用服务名互访，不需要 IP
      MYSQL_DATABASE: guestbook
      MYSQL_USER: guest
      MYSQL_PASSWORD: guest123
    depends_on:
      db:
        condition: service_healthy    # 等 MySQL 健康了再起，避免 php 先连失败

  db:
    image: mysql:8.0
    container_name: lnmp-mysql
    restart: unless-stopped
    mem_limit: 768m            # MySQL 是最大头(实测~384M)，锁住上限防止吃穿 2G
    mem_reservation: 384m
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: guestbook
      MYSQL_USER: guest
      MYSQL_PASSWORD: guest123
    volumes:
      - mysql_data:/var/lib/mysql                              # 数据落盘 -> 删容器不丢
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # 首次启动自动执行建表
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:   # named volume：Docker 在宿主机专门目录里持久化 MySQL 数据
