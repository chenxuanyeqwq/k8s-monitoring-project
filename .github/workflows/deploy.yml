# CI/CD 流水线:代码 push 到 main → 自动部署到阿里云 ECS
# 工作原理:
#   1. checkout 拉取代码
#   2. scp 把 01-lnmp 目录上传到服务器 /opt/k8s-project
#   3. ssh 在服务器上执行 01-lnmp/deploy.sh(构建镜像 + compose up + 自检)
#
# 前置配置(GitHub 仓库 Settings → Secrets and variables → Actions):
#   SERVER_HOST       = 服务器公网 IP,如 8.217.195.115
#   SERVER_USER       = SSH 用户名,如 root
#   SERVER_PASSWORD   = SSH 密码(root 密码)
name: Deploy to Aliyun ECS

on:
  push:
    branches: [main]
    paths:
      - '01-lnmp/**'               # 只有动了 LNMP 代码才触发
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}            # 也支持手动在 GitHub 页面点"运行"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ① Checkout 代码
        uses: actions/checkout@v4

      - name: ② 上传 01-lnmp 到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "01-lnmp"
          target: "/opt/k8s-project"

      - name: ③ 远程执行部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            bash /opt/k8s-project/01-lnmp/deploy.sh
