groups:
  - name: cloud-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "云服务器 CPU 使用率过高"
          description: "实例 {{ $labels.instance }} CPU 使用率超过 80%"
      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "云服务器磁盘使用率过高"
          description: "根分区使用率超过 80%"
      - alert: High5xxRate
        expr: |
          sum(rate(nginx_http_requests_total{code=~"^5"}[5m])) by (instance)
          / clamp_min(sum(rate(nginx_http_requests_total[5m])) by (instance), 0.001) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Nginx 5xx 错误率过高"
          description: "实例 {{ $labels.instance }} 5xx 率超过 5%"
      - alert: MySQLDown
        expr: mysql_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 不可达"
          description: "mysqld-exporter 无法连接数据库"
      # 2026-09-02 事故后新增：2G 宿主机可用内存长期 ~300-400MiB，
      # 缺内存预警 → 崩溃前无人知道。低于 300MiB 持续 10 分钟即告警（前置预警，比黑盒探测早）
      - alert: LowMemory
        expr: node_memory_MemAvailable_bytes < 300 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "服务器可用内存不足"
          description: "实例 {{ $labels.instance }} 可用内存低于 300MiB（当前 {{ $value | humanize1024 }}B），存在内存耗竭/级联崩溃风险"
