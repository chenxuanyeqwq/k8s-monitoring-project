global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
  - job_name: mysql
    static_configs:
      - targets: ['mysqld-exporter:9104']
