# 云服务器监控栈 —— node-exporter + Prometheus + Alertmanager + feishu-bridge + Grafana
# 用法: docker compose -f docker-compose.monitoring.yml up -d --build
name: cloud-monitoring

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cm-node-exporter
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cm-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom_data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cm-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  feishu-bridge:
    build: ./feishu-bridge
    container_name: cm-feishu-bridge
    env_file: ../.env
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cm-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?必须设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - graf_data:/var/lib/grafana
    ports:
      - '3000:3000'
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: cm-nginx-exporter
    command: ['-nginx.scrape-uri=http://nginx/stub_status']
    networks: [default, lnmp]
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0   # v0.15 有 .my.cnf 解析坑,用 v0.14 直接吃 DATA_SOURCE_NAME
    container_name: cm-mysqld-exporter
    environment:
      DATA_SOURCE_NAME: "exporter:exporter123@(db:3306)/"
    networks: [default, lnmp]
    restart: unless-stopped

networks:
  lnmp:
    external: true
    name: 01-lnmp_default

volumes:
  prom_data:
  graf_data:
